name: release-apk

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write # нужно, чтобы прикрепить APK к GitHub Release по тегу

env:
  FLUTTER_VERSION: "3.38.5"
  JAVA_VERSION: "17"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Проверка идёт первой и до сборки: пустые release notes или расхождение версий —
      # дефект поставки, а не косметика (ТЗ §15.3).
      - name: Тег, pubspec и CHANGELOG должны совпадать
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pub=$(sed -nE 's/^version:[[:space:]]*([^+]+)\+.*/\1/p' pubspec.yaml | head -1)
          if [ "$tag" != "$pub" ]; then
            echo "тег $tag не совпадает с версией в pubspec.yaml ($pub)" >&2
            exit 1
          fi
          grep -q "^## \[$tag\]" CHANGELOG.md || {
            echo "в CHANGELOG.md нет секции ## [$tag]" >&2
            exit 1
          }

      # versionCode обязан строго возрастать: Android не даёт установить поверх сборку
      # с меньшим значением, а откатить релиз нельзя (ТЗ §15.2, §15.7).
      - name: versionCode должен возрастать
        run: |
          cur=$(sed -nE 's/^version:[[:space:]]*[^+]+\+([0-9]+).*/\1/p' pubspec.yaml | head -1)
          prev_tag=$(git tag --sort=-v:refname | grep -v "^${GITHUB_REF_NAME}$" | head -1 || true)
          if [ -n "$prev_tag" ]; then
            prev=$(git show "$prev_tag:pubspec.yaml" 2>/dev/null |
                   sed -nE 's/^version:[[:space:]]*[^+]+\+([0-9]+).*/\1/p' | head -1)
            if [ -n "$prev" ] && [ "$cur" -le "$prev" ]; then
              echo "versionCode $cur не больше, чем у $prev_tag ($prev)" >&2
              exit 1
            fi
            echo "versionCode $cur > $prev ($prev_tag)"
          else
            echo "первый релиз, versionCode $cur"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: gradle/actions/setup-gradle@v4

      # flutter pub get создаёт android/local.properties, без которого не запустится
      # ни один ./gradlew — порядок шагов менять нельзя.
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # Покрытие движка проверяется и здесь, хотя CI его уже проверил на PR: релиз можно
      # запустить руками через workflow_dispatch, минуя PR, и тогда порога ТЗ §18 п.28
      # не проверил бы никто. Выпуск — последняя точка, где отказ ещё дешёвый.
      - name: Движок, покрытие, границы модулей, unit-тесты
        run: |
          ./gradlew :engine:test :engine:jacocoTestCoverageVerification \
                    :core:verifyModuleBoundaries :updater:verifyUpdaterBoundaries \
                    :core:testReleaseUnitTest :updater:testReleaseUnitTest \
                    :app:verifyReleaseVersion -PstrictVersion=true
        working-directory: android

      # Ключ подписи один на всё время жизни проекта. Секреты задаются в настройках
      # репозитория; офлайн-копия ключа — у заказчика в двух местах (ТЗ §15.4, §20).
      - name: Ключ подписи из секретов
        env:
          # Имена переменных совпадают с именами секретов: проверка ниже обращается к ним
          # косвенно (${!name}) и ругается тем же именем, которое надо задать в настройках.
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # Проверяются все четыре секрета, а не только хранилище. Пустой пароль или алиас
          # не остановил бы сборку сам по себе: он молча уехал бы в key.properties, и отказ
          # вылез бы позже — либо непонятной ошибкой Gradle на этапе подписи, либо, что хуже,
          # сборкой, подписанной не тем ключом. Установить её поверх прежней уже нельзя
          # (INSTALL_FAILED_UPDATE_INCOMPATIBLE), а откатить релиз нельзя тоже.
          #
          # Собираем список отсутствующих целиком и печатаем один раз, а не падаем на первом:
          # при первом же настроенном релизе полезно узнать сразу про все незаданные секреты.
          # Значения не печатаются ни при каких условиях, `set -x` здесь запрещён по той же
          # причине — GitHub маскирует секреты в логе, но полагаться на маскирование нельзя.
          missing=()
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD \
                      ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done
          if [ ${#missing[@]} -ne 0 ]; then
            echo "не заданы секреты подписи: ${missing[*]}" >&2
            echo "релиз подписать нечем — задайте их в настройках репозитория (ТЗ §15.4, §20)" >&2
            exit 1
          fi

          # Битую base64 ловит сам base64 -d: шаг выполняется с `bash -e`, а код возврата
          # конвейера — это код последней команды, то есть декодера.
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.jks
          if [ ! -s android/app/release.jks ]; then
            echo "ANDROID_KEYSTORE_BASE64 декодировался в пустой файл" >&2
            exit 1
          fi
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD" \
            > android/key.properties

      - run: flutter build apk --release --split-per-abi
      - run: flutter build apk --release # универсальный, на случай сомнений в архитектуре

      - name: Активы, суммы, latest.json
        run: scripts/collect-release-assets.sh "${GITHUB_REF_NAME#v}"

      - name: Release notes из CHANGELOG
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ ("^## \\[" v "\\]") {p=1; next}
            p && /^## \[/ {exit}
            p {print}
          ' CHANGELOG.md > RELEASE_NOTES.md
          {
            echo
            echo "### Установка"
            echo
            echo "Скачайте APK для своей архитектуры (при сомнениях — \`universal\`) и разрешите"
            echo "установку из этого источника. Обновление поверх предыдущей версии сохраняет"
            echo "правила и журнал."
            echo
            echo "### Контрольные суммы"
            echo
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
            echo
            echo "Отпечаток сертификата подписи: \`$(cat dist/signing-cert-sha256.txt)\`"
          } >> RELEASE_NOTES.md

      - uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
            dist/latest.json
